<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1c1c1d;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h2 { margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
        button:active { background-color: #006699; }
    </style>
</head>
<body>

    <h2>የመሳሪያ ማረጋገጫ (Device Verification)</h2>
    <p id="status">መረጃው በመሰብሰብ ላይ ነው... እባክህ ትንሽ ጠብቅ።</p>
    
    <button id="verifyBtn" onclick="sendData()">ወደ ቦት ተመለስ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let visitorId = "";

        // FingerprintJS CDN ሳይጠብቅ አፕሊኬሽኑ አስተማማኝ ID እንዲፈጥር ማድረግ
        function getDeviceId() {
            let id = localStorage.getItem("app_dev_id");
            if (!id) {
                id = "DEV-" + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
                localStorage.setItem("app_dev_id", id);
            }
            return id;
        }

        try {
            visitorId = getDeviceId();
            document.getElementById("status").innerText = "መሳሪያህ ተረጋግጧል! ከታች ያለውን ቁልፍ ይጫኑ።";
            document.getElementById("verifyBtn").style.display = "block";
        } catch (e) {
            document.getElementById("status").innerText = "ስህተት ተከሰቷል! እባክህ ገጹን Refresh አድርግ።";
        }

        function sendData() {
            if (visitorId) {
                tg.sendData(JSON.stringify({ device_id: visitorId }));
            }
        }
    </script>
</body>
</html>
