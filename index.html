<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
        }
        .btn {
            background-color: #24a1de;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>የመሣሪያ ማረጋገጫ (Device Verification)</h2>
    <p id="status">እባክዎ የመሣሪያዎን አሻራ እስምናረጋግጥ ትንሽ ይጠብቁ...</p>
    <button class="btn" id="verifyBtn" style="display:none;" onclick="sendData()">ወደ ቦት ተመለስ</button>

    <script>
        let visitorId = "";
        const tg = window.Telegram.WebApp;
        tg.expand();

        FingerprintJS.load().then(fp => {
            fp.get().then(result => {
                visitorId = result.visitorId;
                document.getElementById("status").innerText = "መሣሪያዎ ተረጋግጧል! ከታች ያለውን ቁልፍ ይጫኑ።";
                document.getElementById("verifyBtn").style.display = "block";
            });
        });

        function sendData() {
            tg.sendData(JSON.stringify({ device_id: visitorId }));
        }
    </script>
</body>
</html>
